<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>子 Frame 嵌入页面 - 授权与快捷操作</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f0f5ff;
      color: #1d39c4;
    }
    .card {
      background: #fff;
      border: 1px solid #adc6ff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h3 { margin-top: 0; color: #1d39c4; }
    .form-row { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #333; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background: #2f54eb;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #1d39c4; }
    .status-msg { margin-top: 10px; font-size: 13px; color: #52c41a; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h3>🔗 独立 Frame 授权终端</h3>
    <div class="form-row">
      <label for="sub-token">安全授权码 (Auth Token):</label>
      <input type="text" id="sub-token" placeholder="请输入子域授权密钥..." />
    </div>
    <div class="form-row">
      <label for="sub-tenant">租户标识 (Tenant ID):</label>
      <input type="text" id="sub-tenant" value="TENANT-GLOBAL-88" />
    </div>
    <button id="sub-submit-btn" onclick="submitSubFrame()">提交子系统校验</button>
    <div id="sub-status" class="status-msg" style="display: none;">✅ 子系统已完成身份校验并建立安全连接</div>
  </div>

  <script>
    function submitSubFrame() {
      const token = document.getElementById("sub-token").value;
      const status = document.getElementById("sub-status");
      status.style.display = "block";
      status.innerText = "✅ 校验通过: " + (token || "默认授权码");
    }
  </script>
</body>
</html>
